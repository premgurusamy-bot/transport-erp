# G ROAD LINES platform - local/dev and single-server deployment.
#   copy .env.example .env   (then edit secrets)
#   docker compose up -d --build
#   docker compose exec api python -m app.seed            (first time; add --demo for training data)
# Open http://localhost:8080  (API docs: http://localhost:8080/api/docs)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: groadlines
      POSTGRES_USER: grl
      POSTGRES_PASSWORD: ${GRL_DB_PASSWORD:?set GRL_DB_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U grl -d groadlines"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      GRL_DATABASE_URL: postgresql+psycopg://grl:${GRL_DB_PASSWORD}@db:5432/groadlines
      GRL_STORAGE_DIR: /app/var/storage
    volumes: [storage:/app/var/storage]
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"], interval: 30s }
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      GRL_DATABASE_URL: postgresql+psycopg://grl:${GRL_DB_PASSWORD}@db:5432/groadlines
      GRL_STORAGE_DIR: /app/var/storage
    volumes: [storage:/app/var/storage]
    command: ["python", "-m", "app.worker"]
    depends_on: { api: { condition: service_started } }
  web:
    build: ./web
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [api]
volumes: { dbdata: {}, storage: {} }
