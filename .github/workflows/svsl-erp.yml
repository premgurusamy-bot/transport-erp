# A Prime Transport ERP (svsl-erp/): backend tests on PostgreSQL + frontend type-check & build.
name: svsl-erp

permissions:
  contents: write

on:
  push:
    paths: ["svsl-erp/**", ".github/workflows/svsl-erp.yml"]
  pull_request:
    paths: ["svsl-erp/**", ".github/workflows/svsl-erp.yml"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: svsl_erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/svsl_erp_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/svsl_erp_test
    defaults:
      run:
        working-directory: svsl-erp/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Migrations apply cleanly and match the models
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE svsl_migrate"
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/svsl_migrate alembic upgrade head
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/svsl_migrate alembic check
      - name: Build the sample-data backup (DEMO data, loaded with Admin → Backup → Restore from file)
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE svsl_sample"
          mkdir -p "$RUNNER_TEMP/sample-files" "$RUNNER_TEMP/sample-backups"
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/svsl_sample STORAGE_DIR="$RUNNER_TEMP/sample-files" BACKUP_DIR="$RUNNER_TEMP/sample-backups" \
            RUN_SCHEDULER=false SECRET_KEY=sample-build-key-0123456789-0123456789-0123456789 python svsl_server.py sample-backup A_PRIME_ERP_SAMPLE_DATA.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: A-Prime-ERP-Sample-Data
          path: svsl-erp/backend/A_PRIME_ERP_SAMPLE_DATA.zip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: svsl-erp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  windows-installer:
    needs: [backend, frontend]
    runs-on: windows-latest
    env:
      PG_ZIP: https://get.enterprisedb.com/postgresql/postgresql-16.4-1-windows-x64-binaries.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Third-party licence notices (generated from what this build ships)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pip install -r svsl-erp/backend/requirements.txt pyinstaller
          cd svsl-erp/frontend
          npm ci
          cd ..
          python scripts/third_party_notices.py
      - name: Build web app
        working-directory: svsl-erp/frontend
        run: npm run build
      - name: Build bundled ERP server (PyInstaller)
        working-directory: svsl-erp/backend
        run: pyinstaller --noconfirm svsl-server.spec
      - name: Download PostgreSQL 16 (portable binaries)
        shell: pwsh
        run: |
          Invoke-WebRequest $env:PG_ZIP -OutFile pg.zip
          Expand-Archive pg.zip -DestinationPath pgtmp
          $pg = "pgtmp/pgsql"
          # keep the licence files that come with the PostgreSQL binaries (installed in resources\pgsql\licenses)
          New-Item -ItemType Directory -Force "$pg/licenses" | Out-Null
          Get-ChildItem -Path pgtmp -Recurse -File | Where-Object { $_.Name -match '(?i)licen[cs]e|copying|copyright' -and $_.FullName -notmatch 'pgAdmin' } | ForEach-Object { Copy-Item $_.FullName "$pg/licenses/$($_.Directory.Name)-$($_.Name)" -ErrorAction SilentlyContinue }
          Write-Host "PostgreSQL licence files kept: $((Get-ChildItem "$pg/licenses").Count)"
          Remove-Item -Recurse -Force "$pg/pgAdmin 4", "$pg/doc", "$pg/include", "$pg/StackBuilder", "$pg/symbols" -ErrorAction SilentlyContinue
          # app-local Visual C++ runtime so the database also starts on PCs without the redistributable
          foreach ($d in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") { if (-not (Test-Path "$pg/bin/$d")) { Copy-Item "C:/Windows/System32/$d" "$pg/bin/" } }
          New-Item -ItemType Directory -Force svsl-erp/desktop/res | Out-Null
          Move-Item $pg svsl-erp/desktop/res/pgsql
          Copy-Item -Recurse svsl-erp/backend/dist/svsl-server svsl-erp/desktop/res/server
          Copy-Item -Recurse svsl-erp/frontend/dist svsl-erp/desktop/res/web
      - name: Smoke test on Windows (database + migrations + server + PDF)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $res = (Resolve-Path "svsl-erp/desktop/res").Path
          $tmp = [System.IO.Path]::GetTempPath()
          $data = Join-Path $tmp "svsl-pgdata"
          $pw = Join-Path $tmp "svsl-pw.txt"
          [System.IO.File]::WriteAllText($pw, "smoke-pass")
          if (-not (Test-Path $pw)) { throw "password file not written" }
          & "$res/pgsql/bin/initdb.exe" -D $data -U svsl "--pwfile=$pw" -E UTF8 --locale=C -A scram-sha-256
          # start the database exactly as the desktop app does (pgctl.cjs); fail if it takes longer than 60 s
          node svsl-erp/desktop/pgctl.cjs "$res/pgsql/bin/pg_ctl.exe" 60 start -w -t 120 -D $data -l (Join-Path $tmp "pg.log") -o "-p 54329 -h 127.0.0.1"
          $env:PGPASSWORD = "smoke-pass"
          & "$res/pgsql/bin/createdb.exe" -h 127.0.0.1 -p 54329 -U svsl svsl_erp
          $env:DATABASE_URL = "postgresql+psycopg://svsl:smoke-pass@127.0.0.1:54329/svsl_erp"
          $env:SECRET_KEY = "smoke-secret-key-0123456789-0123456789-0123456789"
          $env:STORAGE_DIR = Join-Path $tmp "svsl-files"
          $env:LICENCE_DIR = Join-Path $tmp "svsl-licence"
          $env:FRONTEND_DIST = Join-Path $res "web"
          $env:INITIAL_ADMIN_PASSWORD = "Smoke@12345"
          $env:RUN_SCHEDULER = "false"
          $env:PORT = "8000"
          & "$res/server/svsl-server.exe" migrate
          & "$res/server/svsl-server.exe" seed
          $p = Start-Process "$res/server/svsl-server.exe" -ArgumentList serve -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { if ((Invoke-WebRequest http://127.0.0.1:8000/api/health -UseBasicParsing -ErrorAction Stop).StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 2 } }
          if (-not $ok) { throw "server did not start" }
          $login = Invoke-RestMethod -Method Post http://127.0.0.1:8000/api/auth/login -ContentType application/json -Body '{"username":"admin","password":"Smoke@12345"}'
          $h = @{ Authorization = "Bearer $($login.token)" }
          $pdf = Invoke-WebRequest "http://127.0.0.1:8000/api/reports/trial_balance?format=pdf" -Headers $h -UseBasicParsing
          if ([System.Text.Encoding]::ASCII.GetString($pdf.Content[0..3]) -ne "%PDF") { throw "PDF failed" }
          $b = Invoke-RestMethod -Method Post http://127.0.0.1:8000/api/backups -Headers $h -ContentType application/json -Body '{}'
          if ($b.status -ne "Verified") { throw "backup failed" }
          # licensing on Windows: installation ID from the machine ID, 15-day trial recorded outside the database
          $lic = Invoke-RestMethod http://127.0.0.1:8000/api/licence -Headers $h
          if ($lic.state -ne "trial" -or $lic.days_left -ne 15 -or $lic.install_id -notmatch "^[0-9A-F]{4}(-[0-9A-F]{4}){3}$") { throw "licence status wrong: $($lic | ConvertTo-Json)" }
          if (-not (Test-Path (Join-Path $env:LICENCE_DIR "aprime-install.json"))) { throw "licence file not written" }
          Write-Host "Installation ID $($lic.install_id), trial $($lic.days_left) days"
          $web = Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing
          if ($web.Content -notmatch "<div id=`"root`">") { throw "web app not served" }
          Stop-Process -Id $p.Id -Force
          & "$res/pgsql/bin/pg_ctl.exe" stop -D $data -m fast
          Write-Host "Windows smoke test passed"
      - name: Build installer
        working-directory: svsl-erp/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: A-Prime-Transport-ERP-Windows-Installer
          path: svsl-erp/desktop/release/*.exe

  android-apk:
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        working-directory: svsl-erp/mobile
        run: |
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../A-Prime-Transport-ERP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: A-Prime-Transport-ERP-Android-APK
          path: svsl-erp/mobile/A-Prime-Transport-ERP.apk

  release:
    needs: [backend, windows-installer, android-apk]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: svsl-erp-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: A Prime Transport ERP build ${{ github.run_number }}
          prerelease: true
          body: |
            **Windows:** download `A-Prime-Transport-ERP-Setup-1.0.0.exe` and run it on the main office computer (it includes the database and server).
            **Android:** download `A-Prime-Transport-ERP.apk` on the phone and install it (allow "Install unknown apps" when asked), then enter the address shown on the office computer under Help → Phone connection.
            **Sample data:** `A_PRIME_ERP_SAMPLE_DATA.zip` – three months of DEMO data for training. Load it with Admin → Backup → Restore from file (your users, company profile and settings are kept); remove it with Admin → Backup → Factory reset.
            Built from commit ${{ github.sha }}.
          files: |
            out/*.exe
            out/*.apk
            out/*.zip
